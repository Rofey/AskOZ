# Golden question set for retrieval evaluation.
#
# Each question lists the pages that answer it (`relevant`, relative to
# base_url). Retrieval "hits" if any relevant page is in the top k results.
# `evidence` is a phrase that must appear on at least one relevant page;
# `askoz eval --validate` checks it, so a wrong label fails loudly instead of
# quietly skewing the scores.
#
# style:
#   plain     everyday wording that may not match the ATO's ("backpackers")
#   official  the ATO's own terms ("working holiday maker")
#   acronym   short forms people search with (TFN, DASP, HECS)
#
# Review these as a real user: would you ask it this way? Is the page right?

base_url: https://www.ato.gov.au/individuals-and-families/

