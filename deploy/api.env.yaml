# Non-secret Cloud Run settings for the API (gcloud run deploy --env-vars-file).
# Secrets (database URL, Redis URL, Anthropic key, IP-hash secret) come from
# Secret Manager via --set-secrets and are never written here.
ASKOZ_CLIENT_IP_SOURCE: cloud_run
# Only the live website may call the API from a browser. Add a custom domain
# here when there is one. Local dev talks to the local API, not this one.
ASKOZ_CORS_ORIGINS: '["https://askoz-app.web.app", "https://askoz-app.firebaseapp.com"]'
