# Local development services. Production uses managed equivalents
# (Neon/Supabase Postgres in Sydney, Upstash Redis) with the same interfaces.
services:
  postgres:
    # Official Postgres 17 image with the pgvector extension pre-built.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: askoz
      POSTGRES_PASSWORD: askoz # local-only credential
      POSTGRES_DB: askoz
    ports:
      - "127.0.0.1:5432:5432" # bind to localhost only, not your whole network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro # runs once, on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askoz -d askoz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
